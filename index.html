<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>山﨑光｜堺市議会議員｜大阪維新の会 公式サイト</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js" defer></script>

<body>

  <header class="header">
    <div class="header__inner">

      <div class="header__logo">
        <a href="/" class="header__logo-link">
          <p class="header__logo-sub">
            堺市議会議員｜大阪維新の会

          <div class="header__logo-main">
            <span class="header__logo-name">山﨑 光</span>
            <span class="header__logo-text">オフィシャルサイト</span>
          </div>
        </a>
      </div>

      <nav class="header__nav">
        <ul class="header__nav-list">

          <li class="header__nav-item">
            <a href="#greetings" class="header__nav-link">
              <span class="header__nav-ja">ごあいさつ</span>
              <span class="header__nav-en">GREETINGS</span>
            </a>
          </li>

          <li class="header__nav-item">
            <a href="#profile" class="header__nav-link">
              <span class="header__nav-ja">プロフィール</span>
              <span class="header__nav-en">PROFILE</span>
            </a>
          </li>

          <li class="header__nav-item">
            <a href="#policy" class="header__nav-link">
              <span class="header__nav-ja">政策</span>
              <span class="header__nav-en">POLICY</span>
            </a>
          </li>

          <li class="header__nav-item">
            <a href="#achievements" class="header__nav-link">
              <span class="header__nav-ja">活動報告</span>
              <span class="header__nav-en">ACHIEVEMENTS</span>
            </a>
          </li>

          <li class="header__nav-item">
            <a href="#contact" class="header__nav-link">
              <span class="header__nav-ja">お問い合わせ</span>
              <span class="header__nav-en">CONTACT</span>
            </a>
          </li>

        </ul>
      </nav>

      <div class="header__sns">
        <a href="#" class="header__sns-link" target="_blank" rel="noopener noreferrer" aria-label="X">
          <img src="./images/icon-x.png" alt="" class="header__sns-image">
        </a>
      </div>

      <button class="header__hamburger" type="button" aria-label="メニューを開く" aria-expanded="false">
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
      </button>

    </div>
  </header>

  <main>

    <section class="main-visual">
      <div class="main-visual__inner">

        <div class="main-visual__wave">
          <img src="./images/fv-wave.png" alt="" class="main-visual__wave-image">
        </div>

        <div class="main-visual__person">
          <img src="./images/fv-person.png" alt="山﨑光" class="main-visual__person-image">
        </div>

        <div class="main-visual__copy">
          <img src="./images/fv-copy.png" alt="堺区 堺市議会議員 大阪維新の会 山﨑光 Yamasaki Hikari Official Website 堺の可能性を、現実に"
            class="main-visual__copy-image">
